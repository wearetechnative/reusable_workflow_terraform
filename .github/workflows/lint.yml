name: Lint
permissions: {}

on:
  workflow_call:
    inputs:
      strict:
        description: >-
          Fail the build when TFLint reports findings. Leave false while a
          repository still has findings to clean up; a TFLint *error* (a config
          it cannot parse) fails the build either way.
        type: boolean
        default: false
      skip-validate:
        description: >-
          Skip terraform validate. Set this for modules that declare
          configuration_aliases: as a root module there is no aliased provider
          configured, so validate reports "missing provider" by design.
        type: boolean
        default: false

jobs:
  tflint:
    name: Terraform Lint
    runs-on: ubuntu-latest

    steps:
      - &checkout
        name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          # Pinned deliberately. The default is "latest", which would let a new
          # TFLint release turn every consumer red overnight.
          tflint_version: v0.65.0

      - name: Show version
        run: tflint --version

      # Revived from module_checker.sh, which sat commented out in the old
      # shared workflow while six repositories quietly violated the rule it
      # was written to enforce. The validate job rewrites git@ URLs so a
      # runner can fetch them, but a module that needs that rewrite only
      # builds inside this CI - not on a developer machine without a key,
      # and not for a consumer.
      - name: Module sources must not use git@
        env:
          STRICT: ${{ inputs.strict }}
        run: |
          hits=$(grep -rniE 'source[[:space:]]*=[[:space:]]*"git@' --include='*.tf' . || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::Module sources must use git::https://github.com/... , not git@github.com:"
            if [ "${STRICT}" = "true" ]; then exit 1; fi
            echo "::warning::Not failing because strict is disabled."
          else
            echo "No git@ module sources."
          fi

      - name: Run TFLint
        env:
          STRICT: ${{ inputs.strict }}
        run: |
          set +e
          # --recursive matters: several modules keep all their .tf files in
          # subdirectories, and a root-only run passes while checking nothing.
          tflint --recursive -f compact
          code=$?
          set -e
          case "$code" in
            0) echo "No findings." ;;
            2) if [ "${STRICT}" = "true" ]; then
                 echo "::error::TFLint findings, and strict is enabled."
                 exit 2
               fi
               echo "::warning::TFLint findings. Not failing because strict is disabled."
               ;;
            *) echo "::error::TFLint exited with $code - this is an error, not a finding."
               exit "$code"
               ;;
          esac

  validate:
    name: Terraform Validate
    if: ${{ !inputs.skip-validate }}
    runs-on: ubuntu-latest

    env:
      TF_IN_AUTOMATION: '1'
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugin-cache

    steps:
      - *checkout

      - name: Setup Terraform
        # Deliberately unpinned: every required_version constraint in these
        # modules is a lower bound, so the newest release satisfies them all,
        # and it is what consumers actually run.
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: Cache provider plugins
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.terraform-plugin-cache
          key: ${{ runner.os }}-tfproviders-${{ hashFiles('**/*.tf') }}
          restore-keys: ${{ runner.os }}-tfproviders-

      - name: Fetch git module sources over HTTPS
        # Several modules pin their sources in SSH form (git@github.com:owner/repo).
        # The runner has no SSH key, so terraform init fails to clone them even
        # though every one of those targets is a public repository. Rewriting to
        # HTTPS makes them fetchable without adding a secret. Sources that are
        # genuinely private stay unreachable, which is the correct outcome.
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"

      - name: Validate every module directory
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          fail=0
          # The plugin cache has no locking, so these run one at a time.
          for dir in $(find . -name '*.tf' -not -path './.git/*' -printf '%h\n' | sort -u); do
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -input=false -no-color || fail=1
            terraform -chdir="$dir" validate -no-color || fail=1
            echo "::endgroup::"
          done
          exit $fail
