name: Test terraform modules

on:
  workflow_call:
jobs: 
  test: 
    runs-on: ubuntu-latest
    steps: 
      - name: checkout repo
        uses: actions/checkout@v4
              
      - name: trivy config scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          exit-code: 0
          
      - uses: hashicorp/setup-terraform@v4
      - name: Terraform Init
        id: init
        run: terraform init

